name: Mantener Repositorio Activo

on:
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch: 

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Usamos tu Token personal para autenticar el clonado y la subida
          token: ${{ secrets.MIPROPIO_TOKEN }}
          
      - name: Prevenir desactivacion por inactividad
        uses: gautamkrishnar/keepalive-workflow@v3
        with:
          use_api: false
