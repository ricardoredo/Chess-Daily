name: Mantener Repositorio Activo

on:
  schedule:
    # Se ejecuta todos los miércoles a las 00:00 UTC
    - cron: '0 0 * * 3'
  workflow_dispatch: # Permite activarlo manualmente desde la pestaña Actions

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Permiso nativo para escribir en tu propio repositorio
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Hacer un micro-cambio nativo
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # Agrega la fecha actual al final del archivo sin borrar lo anterior
          echo "Ultima actualizacion automatica: $(date)" >> .github/keepalive_ping.txt
          
          git add .github/keepalive_ping.txt
          
          # El argumento --allow-empty evita errores si el archivo no cambia
          git commit --allow-empty -m "Chore: Mantener repositorio despierto"
          
          git push origin main
